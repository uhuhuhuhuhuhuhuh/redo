name: Build Glasses Hub APK

on:
  push:
    branches: [glasses-hub-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :companion:assembleDebug 2>&1 | tail -n 250
      - name: Collect APK and source notes
        run: |
          mkdir -p dist
          cp companion/build/outputs/apk/debug/companion-debug.apk dist/GlassesHub-debug.apk
          cp README.md dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: glasses-hub-apk
          path: dist/*
          if-no-files-found: error
